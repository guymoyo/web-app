server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Preserve oauth2-proxy authentication headers
    # These headers are set by oauth2-proxy and should be forwarded to the application
    proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
    proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
    proxy_set_header X-Auth-Request-Access-Token $http_x_auth_request_access_token;
    proxy_set_header X-Forwarded-User $http_x_forwarded_user;
    proxy_set_header X-Forwarded-Email $http_x_forwarded_email;

    # Static assets with caching
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # API proxy - Forward API calls to Fineract backend
    # This assumes your nginx/oauth2-proxy setup will proxy to Fineract
    # Adjust the proxy_pass URL based on your actual Fineract backend location
    location /fineract-provider/api/ {
        # The actual proxy configuration will be in your main nginx config
        # This is a placeholder - in production, this is handled by the main nginx
        # that sits in front of oauth2-proxy
        try_files $uri @backend;
    }

    location @backend {
        # Placeholder for backend proxy
        # In production, API calls will be proxied by the main nginx config
        return 502 "Backend proxy not configured. Configure this in your main nginx setup.";
    }

    # Angular SPA - All routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable logging for favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Disable logging for robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
